name: build installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          $gen = "Visual Studio 17 2022"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $line = & $vswhere -latest -property catalog_productLineVersion
            if ("$line" -eq "18") { $gen = "Visual Studio 18 2026" }
          }
          Write-Host "Using generator $gen"
          cmake -S . -B build -G $gen -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc installer\PredatorUtility.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PredatorUtility-Setup
          path: dist/PredatorUtility-Setup-*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PredatorUtility-Setup-*.exe
          generate_release_notes: true
